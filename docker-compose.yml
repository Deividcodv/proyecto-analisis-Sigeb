version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigeb-postgres
    environment:
      POSTGRES_DB: sigeb
      POSTGRES_USER: sigeb
      POSTGRES_PASSWORD: sigeb123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigeb -d sigeb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
